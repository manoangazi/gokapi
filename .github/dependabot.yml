version: 2
updates:
  # Keep GitHub Actions (including SHA-pinned ones) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep Go modules patched, so the aws-sdk-go-v2 migration and other deps stay current.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
