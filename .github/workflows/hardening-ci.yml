name: Hardening CI

# CI gate for the internal `hardening` fork: full Linux test matrix, govulncheck,
# and a hardened-image build. Runs on the hardening branch and any PR.
#
# SECURITY NOTE (plan item D7): actions are pinned by full commit SHA (a mutable tag
# on a third-party action is a supply-chain risk); the trailing comment records the
# human-readable version. Dependabot (.github/dependabot.yml) keeps these current.
# The publish job attaches SLSA build provenance + an SBOM and cosign-signs the
# pushed image digest (keyless, via GitHub OIDC).

on:
  workflow_dispatch:
  push:
    branches: [hardening]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go generate ./...
      - name: Vet
        run: go vet --tags=test,awsmock ./...
      - name: Test (awsmock)
        run: go test ./... -parallel 8 -count=1 --tags=test,awsmock
      - name: Test (noaws)
        run: go test ./... -parallel 8 -count=1 --tags=test,noaws
      - name: Test (S3 via gofakes3)
        run: GOKAPI_AWS_BUCKET="gokapi" GOKAPI_AWS_REGION="eu-central-1" GOKAPI_AWS_KEY="keyid" GOKAPI_AWS_KEY_SECRET="secret" go test ./... -count=1 --tags=test,awstest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build hardened image
        # Build-only (no push) to validate the container layer, including the
        # non-root user and go generate step inside the multi-stage build.
        run: docker build -f Dockerfile.hardened -t gokapi-hardened:ci .
      - name: Assert image runs as non-root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' gokapi-hardened:ci)
          echo "Image user: $user"
          test "$user" = "10001:10001"

  # Publish + sign only on push to hardening / manual dispatch (never on PRs from
  # forks, which must not receive registry or signing credentials). Pushes to GHCR
  # with SLSA build provenance and an SBOM, then signs the image digest with cosign
  # keyless (GitHub OIDC — no long-lived keys).
  publish:
    if: github.event_name != 'pull_request'
    needs: [test, vulncheck, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write         # cosign keyless OIDC
      attestations: write     # build provenance attestation
    env:
      IMAGE: ghcr.io/${{ github.repository }}-hardened
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - name: Build and push (with provenance + SBOM)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.hardened
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
